<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тарифы — KOMPASS</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#0E1F5B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0d1829;--navy2:#111f35;--blue:#2a4a7a;--blue2:#3a5a8a;--silver:#b8c8e0;--gray:#8aaad0;--border:rgba(255,255,255,0.08);--green:#10b981;--warn:#f59e0b}
body{background:var(--navy);color:#fff;font-family:'Noto Sans KR','Inter',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--silver)}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);max-width:1000px;margin:0 auto}
header a.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font-weight:700;letter-spacing:.06em}
header a.logo img{width:30px;height:30px}
main{max-width:1000px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:24px;margin-bottom:6px}
.sub{color:var(--gray);font-size:14px;margin-bottom:18px}
.test{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.4);color:#fcd34d;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{padding:8px 18px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--gray);cursor:pointer;font:inherit;font-size:14px;font-weight:600}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:16/10;display:block;object-fit:cover}
.card .b{padding:12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .g{font-size:12px;color:var(--gray)}
.card .t{font-weight:600;font-size:15px}
.card .n{font-size:12px;color:var(--gray)}
.card .p{font-weight:700;color:var(--silver);margin-top:auto;padding-top:6px}
.btn{display:inline-block;text-align:center;padding:10px 16px;border-radius:10px;border:none;background:var(--blue2);color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card .btn{margin:0 14px 14px}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.detail img{width:100%;border-radius:14px;display:block}
.box{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:14px;padding:18px}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.row:last-of-type{border-bottom:none}
.row[hidden]{display:none}
.row span:first-child{color:var(--gray)}
.total{font-size:22px;font-weight:700}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--silver);margin:14px 0}
.agree input{margin-top:4px;width:18px;height:18px;flex:none}
.wide{width:100%;font-size:16px;padding:14px}
.note{font-size:12px;color:var(--gray);margin-top:10px}
.err{color:#fca5a5;font-size:13px;margin-top:8px;min-height:1em}
footer{border-top:1px solid var(--border);color:var(--gray);font-size:12px;line-height:1.8;padding:20px 16px;max-width:1000px;margin:0 auto}
@media (max-width:720px){.detail{grid-template-columns:1fr}header{padding:12px 16px}}
.lang-switcher{display:flex;gap:2px;background:rgba(255,255,255,0.06);border-radius:8px;padding:3px}
.lang-btn{padding:4px 10px;border-radius:6px;border:none;background:transparent;color:var(--gray);cursor:pointer;font-size:12px;font-weight:600;font-family:inherit}
.lang-btn.active{background:var(--blue);color:#fff}
</style>
</head>
<body>
<header>
  <a class="logo" href="/"><img src="/favicon.svg" alt="">KOMPASS</a>
  <div style="display:flex;align-items:center;gap:12px">
    <a href="/" style="font-size:14px" data-i18n="back"></a>
    <div class="lang-switcher">
      <button class="lang-btn" onclick="setLang('ru')">РУС</button>
      <button class="lang-btn" onclick="setLang('ko')">한국어</button>
      <button class="lang-btn" onclick="setLang('en')">ENG</button>

  </div>
</header>
<main>

    <div class="box">
      <div style="color:var(--gray);font-size:13px" data-i18n="monthly"></div>
      <h1 style="font-size:22px;margin:4px 0 10px" id="pname"></h1>
      <ul class="sub" style="margin:0 0 8px 18px" id="plist"></ul>
      <div class="row"><span data-i18n="r_how"></span><span data-i18n="r_how_v"></span></div>
      <div class="row"><span data-i18n="r_period"></span><span data-i18n="r_period_v"></span></div>
      <div class="row"><span data-i18n="r_renew"></span><span data-i18n="r_renew_v"></span></div>
      <div class="row"><span data-i18n="r_price"></span><span class="total" id="pprice"></span></div>
      <label style="display:block;margin-top:12px;font-size:13px;color:var(--silver)"><span data-i18n="phone"></span>
        <input id="phone" inputmode="tel" placeholder="010-1234-5678" style="display:block;width:100%;margin-top:6px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:#fff;font:inherit"></label>
      <p class="note" style="margin-top:8px" data-i18n="terms"></p>
      <label class="agree"><input type="checkbox" id="agree"> <span id="agreeTxt"></span></label>
      <button class="btn wide" id="pay" disabled data-i18n="pay"></button>
      <div class="err" id="err"></div>
      <p class="note" data-i18n="safe"></p>
    </div>
  </div>
</main>

 ru:{back:'← На главную',test:'Тестовый режим: деньги не списываются',title:'Тарифы',

  plans:{free:['Free',['AI-помощник, чат с менеджером, статусы заявок','Хранилище документов, напоминания о сроках, календарь']],
   silver:['Silver · налоги и страховка',['Всё из Free','Ежемесячная проверка налогов: перечислил ли работодатель удержанный налог','Проверка статуса и оплаты медстраховки','Нашли проблему — менеджер связывается первым']],
   gold:['Gold · полный мониторинг',['Всё из Silver','Пенсия, штрафы с камер, местные налоги, неоплаченный Hi-Pass','Справки о доходах и налогах']],
   platinum:['Platinum · бизнес + Gold',['Всё из Gold','Раздел для бизнеса: проверка контрагентов, счета-фактуры, налоговый календарь и документы фирмы','Без ограничения числа фирм, приглашение сотрудников']]}},
 ko:{back:'← 홈',test:'테스트 결제 모드 — 실제로 청구되지 않습니다',title:'요금제',
  intro:'KOMPASS 모니터링은 담당 매니저와 공공기관 조회로 매월 고객님의 상태를 확인하고 문제가 생기면 먼저 알려드리는 서비스입니다.',
  monthly:'월 구독',r_how:'제공 방법',r_how_v:'결제 즉시 앱·웹 이용 (실물 배송 없음)',r_period:'결제 주기',r_period_v:'1개월',
  r_renew:'자동 갱신',r_renew_v:'매월',r_price:'월 요금',phone:'KOMPASS 앱에 로그인한 휴대폰 번호',
  terms:'첫 결제는 카드 등록 즉시, 이후 매월 같은 날 자동 결제됩니다. 결제 전 결제일과 금액을 안내하며, 자동 갱신은 언제든지 해지할 수 있습니다(이미 결제한 기간 종료 시까지 이용). 해지 문의: 010-5183-5885, Kompass.kor@gmail.com',
  agree:'위 내용과 <a href="/terms.html" target="_blank">이용약관</a>, <a href="/refund.html" target="_blank">환불정책</a>, <a href="/privacy.html" target="_blank">개인정보처리방침</a>을 확인했으며, 매월 {p} 자동 결제에 동의합니다.',
  pay:'카드 등록하고 구독하기',safe:'결제는 토스페이먼츠를 통해 안전하게 처리되며, 카드 정보는 KOMPASS에 저장되지 않습니다.',
  free:'무료',perMonth:' / 월',pageTitle:'요금제 — KOMPASS',
  plans:{free:['Free · 무료',['AI 상담·담당 매니저 채팅·신청 현황','서류 보관함·만료일 알림·기한 캘린더']],
   silver:['Silver · 세금·건강보험 모니터링',['Free의 모든 기능','매월 세금 상태 확인 — 회사가 원천징수한 세금을 신고·납부했는지','건강보험 가입·납부 상태 확인','문제 발견 시 담당 매니저가 먼저 연락']],
   gold:['Gold · 종합 모니터링',['Silver의 모든 기능','국민연금·과태료(무인단속)·지방세·하이패스 미납 확인','소득·납세 관련 증명서 조회']],
   platinum:['Platinum · 사업자 + Gold',['Gold의 모든 기능','사업자 전용: 거래처 상태 확인, 세금계산서, 사업자 세금 캘린더·서류','사업자 수 제한 없음, 직원 초대 가능']]}},
 en:{back:'← Home',test:'Test payment mode — no money is charged',title:'Plans',
  intro:'Kompass monitoring: your manager and government data checks review your status every month and warn you first if something is wrong.',

  terms:'The first charge happens right after you add a card, then every month on the same day. We notify you of the date and amount before each charge; you can turn off auto-renewal at any time (the plan stays active until the end of the paid period). Questions: 010-5183-5885, Kompass.kor@gmail.com',

  pay:'Add card and subscribe',safe:'Payments are processed by Toss Payments; Kompass does not store card details.',
  free:'free',perMonth:' / month',pageTitle:'Plans — KOMPASS',
  plans:{free:['Free',['AI assistant, chat with your manager, request status','Document storage, expiry reminders, calendar']],
   silver:['Silver · taxes & health insurance',['Everything in Free','Monthly tax check: did your employer pay the tax withheld from your salary','Health insurance status and payments','If we find a problem, your manager contacts you first']],
   gold:['Gold · full monitoring',['Everything in Silver','Pension, traffic camera fines, local taxes, unpaid Hi-Pass tolls','Income and tax certificates']],
   platinum:['Platinum · business + Gold',['Everything in Gold','Business section: counterparty checks, tax invoices, company tax calendar and documents','Unlimited companies, invite your staff']]}},
};
const PLANS = [{id:'free',price:0},{id:'silver',price:9900},{id:'gold',price:19900},{id:'platinum',price:49900}];
const $ = id => document.getElementById(id);
const won = n => lang === 'ko' ? n.toLocaleString('ko-KR') + '원' : '₩' + n.toLocaleString('en-US');
if (!TOSS_CLIENT_KEY.startsWith('test_')) $('testbar').hidden = true;
let cur = PLANS.find(p => p.id === new URLSearchParams(location.search).get('plan')) || PLANS[1];
let lang = (new URLSearchParams(location.search).get('lang') || (navigator.language || '').slice(0, 2));
if (!T[lang]) lang = 'ru';
function render() {
  const L = T[lang], nm = p => L.plans[p.id][0], it = p => L.plans[p.id][1];
  $('plans').innerHTML = PLANS.map(p => '<div class="card" style="cursor:' + (p.price ? 'pointer' : 'default') + ';' + (p.id === cur.id ? 'border-color:#7fb2ff' : '') + '" data-id="' + p.id + '"><div class="b">'
    + '<div class="t">' + nm(p) + '</div><div class="n">' + it(p)[it(p).length - 1] + '</div>'
    + '<div class="p">' + (p.price ? won(p.price) + L.perMonth : L.free) + '</div></div></div>').join('');
  $('plans').querySelectorAll('.card').forEach(c => c.onclick = () => { const p = PLANS.find(x => x.id === c.dataset.id); if (p.price) { cur = p; render(); } });
  $('pname').textContent = nm(cur);
  $('plist').innerHTML = it(cur).map(i => '<li>' + i + '</li>').join('');
  $('pprice').textContent = won(cur.price);
  $('agreeTxt').innerHTML = L.agree.replace('{p}', '<b>' + won(cur.price) + '</b>');
  document.querySelectorAll('[data-i18n]').forEach(el => { const v = L[el.getAttribute('data-i18n')]; if (v !== undefined) el.innerHTML = v; });
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.textContent.trim() === ({ru:'РУС',ko:'한국어',en:'ENG'})[lang]));
  document.documentElement.lang = lang; document.title = L.pageTitle;
}
function setLang(l) { lang = l; render(); }
render();
const phoneOk = () => $('phone').value.replace(/\D/g, '').length >= 10;
const upd = () => $('pay').disabled = !($('agree').checked && phoneOk());
$('agree').onchange = upd; $('phone').oninput = upd;
$('pay').onclick = async () => {
  $('err').textContent = ''; $('pay').disabled = true;
  try {
    const customerKey = 'c_' + crypto.randomUUID().replace(/-/g, '').slice(0, 30);
    const q = '?plan=' + cur.id + '&phone=' + encodeURIComponent($('phone').value.replace(/\D/g, ''));
    const payment = TossPayments(TOSS_CLIENT_KEY).payment({customerKey});
    await payment.requestBillingAuth({
      method: 'CARD',
      successUrl: location.origin + '/subscribe-success.html' + q,
      failUrl: location.origin + '/subscribe-fail.html',
    });
  } catch (e) {
    $('err').textContent = (e && (e.message || e.code)) || '결제를 시작하지 못했습니다.';
    upd();
  }
};
</script>
</body>
</html>
