<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex">
<title>Оплата — KOMPASS</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<meta name="theme-color" content="#0E1F5B">
<script src="https://js.tosspayments.com/v2/standard"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0d1829;color:#fff;font-family:-apple-system,'Noto Sans KR','Inter',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;line-height:1.5}
.card{width:100%;max-width:380px;background:#14223a;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:22px 20px}
.t{font-size:20px;font-weight:800}.d{color:#8aaad0;font-size:14px;margin-top:2px}
.p{font-size:28px;font-weight:800;margin:14px 0 4px}.p small{font-size:15px;font-weight:600;color:#8aaad0}
.acc{background:rgba(255,255,255,.05);border-radius:10px;padding:9px 12px;font-size:14px;margin:12px 0}
.acc b{letter-spacing:.5px}
label{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#c9d6ea;margin:14px 0 16px;cursor:pointer}
label input{width:20px;height:20px;margin-top:1px;flex:none}
a{color:#9fc3ff}
button{width:100%;height:52px;border:none;border-radius:14px;background:#3182f6;color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.45}
.n{font-size:12px;color:#8aaad0;margin-top:12px;text-align:center}
.err{color:#fca5a5;font-size:13px;margin-top:10px;text-align:center}
.test{color:#fcd34d;font-size:12px;margin-bottom:10px}
footer{max-width:380px;margin-top:16px;font-size:10.5px;color:#5f7699;text-align:center;line-height:1.5}
footer a{color:#7f97bd}
</style>
</head>
<body>
<div class="card" id="c">
  <div class="test" id="test" hidden>Тестовый режим — деньги не списываются</div>
  <div class="t" id="t">…</div>
  <div class="d" id="d"></div>
  <div class="p" id="p"></div>
  <div class="acc" id="acc" hidden>Аккаунт Kompass: <b id="ph"></b></div>
  <label><input type="checkbox" id="ok"><span>Согласен с <a href="/terms.html" target="_blank">условиями</a>, <a href="/refund.html" target="_blank">возвратом</a>, <a href="/privacy.html" target="_blank">конфиденциальностью</a> и ежемесячным списанием <b id="pp"></b>. Перед списанием сообщим дату и сумму.</span></label>
  <button id="b" disabled>Оплатить картой</button>
  <div class="n">Автопродление можно отключить в любой момент в приложении: Профиль → Подписка</div>
  <div class="err" id="e"></div>
</div>
<footer>콤파스인천점(KOMPASS) · 대표자 LI EVGENIYA · 사업자등록번호 865-74-00596 · 통신판매업 2026-인천연수구-2095<br>인천광역시 연수구 비류대로433번길 12, 1층 5호 · 010-5183-5885 · Kompass.kor@gmail.com · <a href="/refund.html">환불정책</a></footer>
<script>
// 05.11 (Сергей): маленькое окно оплаты из приложения. Тариф и аккаунт — из одноразовой ссылки (t),
// номер не вводится. Подробные тарифы — на /subscribe.
const CF = 'https://us-central1-kompass-sandbox.cloudfunctions.net/';
const t = new URLSearchParams(location.search).get('t') || '';
const NAMES = {silver: ['Silver', 'налоги, страховка, пенсия'], gold: ['Gold', 'Silver + штрафы, местные налоги, Hi-Pass'], platinum: ['Platinum', 'Gold + раздел для бизнеса']};
const $ = id => document.getElementById(id);
const won = n => '₩' + Number(n).toLocaleString('en-US');
let info = null;
fetch(CF + 'tossCheckoutInfo?t=' + encodeURIComponent(t), {cache: 'no-store'}).then(r => r.json()).then(j => {
  if (!j.ok) { $('t').textContent = 'Ссылка недействительна'; $('d').textContent = j.message || 'Откройте оплату из приложения ещё раз.'; $('b').hidden = true; document.querySelector('label').hidden = true; return; }
  info = j;
  const nm = NAMES[j.plan] || [j.planName, ''];
  $('t').textContent = 'Kompass ' + nm[0]; $('d').textContent = nm[1];
  $('p').innerHTML = won(j.price) + ' <small>/ мес</small>'; $('pp').textContent = won(j.price);
  if (j.phoneMasked) { $('acc').hidden = false; $('ph').textContent = j.phoneMasked; }
  $('test').hidden = j.mode !== 'test';
}).catch(() => { $('t').textContent = 'Нет связи'; $('d').textContent = 'Проверьте интернет и откройте оплату ещё раз.'; });
$('ok').onchange = () => $('b').disabled = !($('ok').checked && info);
$('b').onclick = async () => {
  $('e').textContent = ''; $('b').disabled = true;
  try {
    const customerKey = 'c_' + crypto.randomUUID().replace(/-/g, '').slice(0, 30);
    const payment = TossPayments(info.clientKey).payment({customerKey});
    await payment.requestBillingAuth({method: 'CARD',
      successUrl: location.origin + '/subscribe-success.html?ct=' + t + '&plan=' + info.plan,
      failUrl: location.origin + '/subscribe-fail.html'});
  } catch (e) { $('e').textContent = (e && (e.message || e.code)) || 'Не удалось открыть оплату'; $('b').disabled = !$('ok').checked; }
};
</script>
</body>
</html>
