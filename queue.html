<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Электронная очередь — KOMPASS</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<meta name="theme-color" content="#ffffff">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:#ffffff;color:#111827;font-family:-apple-system,'Noto Sans KR','Inter',sans-serif;line-height:1.45;padding:14px 14px 40px;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:440px}
.top{display:flex;align-items:center;gap:10px;margin:4px 2px 12px}
.top img{width:34px;height:34px;border-radius:8px}
.top b{font-size:17px}.top span{color:#64748b;font-size:13px;display:block;margin-top:-2px}
.prog{margin:0 2px 12px}
.prog .lbl{display:flex;justify-content:space-between;font-size:13px;color:#64748b;margin-bottom:6px}
.prog .lbl b{color:#111827}
.bar{height:8px;background:#e5e9f0;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#2563eb;border-radius:6px;transition:width .3s}
.dots{display:flex;gap:6px;margin-top:8px}
.dots s{flex:1;height:26px;border-radius:8px;background:#eef1f6;color:#94a3b8;font-size:12.5px;font-weight:700;text-decoration:none;display:flex;align-items:center;justify-content:center}
.dots s.on{background:#2563eb;color:#fff}.dots s.ok{background:#d1fae5;color:#047857}
.card{background:#ffffff;border:1px solid #e2e8f0;border-radius:20px;padding:20px 18px;box-shadow:0 2px 14px rgba(15,23,42,.06)}
h1{font-size:21px;font-weight:800;margin-bottom:6px}
.sub{color:#475569;font-size:14.5px;margin-bottom:14px}
label.f{display:block;font-size:13px;color:#64748b;margin:12px 0 5px}
input[type=text],input[type=tel],select{width:100%;height:52px;border-radius:12px;border:1px solid #cbd5e1;background:#ffffff;color:#111827;font:inherit;font-size:18px;padding:0 14px;outline:none}
input:focus,select:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.15)}
input.bad{border-color:#dc2626}
.btn{display:block;width:100%;min-height:54px;border:none;border-radius:14px;background:#2563eb;color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer;margin-top:16px;padding:10px}
.btn:disabled{opacity:.4}
.btn.g{background:#059669}.btn.o{background:#ffffff;border:1px solid #cbd5e1;color:#334155;font-weight:600;font-size:15px;min-height:48px;margin-top:10px}
.back{background:none;border:none;color:#64748b;font:inherit;font-size:14px;margin-top:14px;cursor:pointer;width:100%;padding:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:12px 14px;border-radius:12px;border:1px solid #cbd5e1;background:#fff;color:#111827;font-size:16px;font-weight:600;cursor:pointer;user-select:none;min-width:74px;text-align:center}
.chip.on{background:#2563eb;border-color:#2563eb;color:#fff}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:#1f2937;margin:12px 0;cursor:pointer}
.chk input{width:24px;height:24px;flex:none;margin-top:1px}
a{color:#2563eb}
.err{color:#dc2626;font-size:14px;margin-top:12px;text-align:center;min-height:1px}
.note{font-size:12.5px;color:#64748b;margin-top:10px}
.pzw{position:sticky;top:0;z-index:5;background:#fff;padding:6px 0 4px;margin:6px 0 2px}
.pz{height:210px;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid #cbd5e1;background:#f1f5f9;touch-action:pan-x pan-y}
.pz img{display:block;width:100%;height:auto;max-width:none;user-select:none;-webkit-user-drag:none}
.pzc{display:flex;align-items:center;gap:8px;margin-top:6px}
.pzc button{width:46px;height:40px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;font-size:22px;font-weight:700;color:#111827;flex:none}
.pzc span{flex:1;text-align:center;font-size:12px;color:#64748b}
.docm{position:fixed;inset:0;z-index:50;background:#fff;display:flex;flex-direction:column}
.docm .dh{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #e2e8f0;font-weight:700;font-size:15px}
.docm .dx{width:44px;height:44px;border-radius:12px;border:1px solid #cbd5e1;background:#fff;font-size:22px;color:#111827}
.docm iframe{flex:1;border:0;width:100%}
.docm .df{padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #e2e8f0}
.chk .cn{display:block;margin-top:6px;font-size:12px;line-height:1.4;color:#64748b}
.warn{background:#fef3c7;border:1px solid #f59e0b;color:#78350f}
.ex{background:#f1f5f9;border-radius:12px;padding:12px;font-size:13.5px;color:#334155;margin-bottom:6px}
.rev{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:4px 12px}
.rev div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #e2e8f0;font-size:14.5px}
.rev div:last-child{border:none}.rev span{color:#64748b;flex:none}.rev b{text-align:right;word-break:break-word}
.rev small{font-weight:400;color:#64748b}
.num{font-size:74px;font-weight:900;text-align:center;letter-spacing:1px;margin:6px 0 0;line-height:1.05;color:#111827}
.st{text-align:center;font-size:17px;margin:8px 0 4px}
.call{background:#059669;color:#fff;border-radius:16px;padding:16px;text-align:center;font-size:20px;font-weight:800;margin-top:12px;animation:p 1.1s infinite}
@keyframes p{50%{opacity:.6}}
.promo{margin-top:14px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:16px;padding:14px;font-size:14px;color:#1e293b}
.promo a{display:block;margin-top:10px;background:#111827;color:#fff;text-align:center;font-weight:800;padding:12px;border-radius:12px;text-decoration:none}
.spin{width:22px;height:22px;border:3px solid rgba(100,116,139,.35);border-top-color:#2563eb;border-radius:50%;display:inline-block;animation:r .8s linear infinite;vertical-align:-5px;margin-right:8px}
.btn .spin{border-color:rgba(255,255,255,.4);border-top-color:#fff}
@keyframes r{to{transform:rotate(360deg)}}
.test{background:#7c3aed;color:#fff;font-size:12.5px;font-weight:700;border-radius:10px;padding:6px 10px;margin-bottom:10px;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="/android-chrome-192.png" alt=""><div><b>KOMPASS</b><span id="ofc">Электронная очередь</span></div></div>
  <div class="test" id="test" hidden>🧪 Тестовый режим — заявка получит номер T…</div>
  <div class="prog" id="prog" hidden>
    <div class="lbl"><span id="plbl">Шаг 1 из 6</span><b id="pname"></b></div>
    <div class="bar"><i id="pbar"></i></div>
    <div class="dots" id="dots"></div>
  </div>
  <div class="card" id="card"><div class="sub"><span class="spin"></span>Загрузка…</div></div>
</div>

<script>
(function () {
  'use strict';
  var API = '/api/queue';
  var qs = new URLSearchParams(location.search);
  var S = { office: qs.get('o') || '', k: qs.get('k') || '', group: qs.get('g') || '', step: 0, years: [], dependents: '', operator: '', bankSkip: false, deps: [], depLater: false };
  var STEPS = ['Согласие', 'Телефон', 'ID-карта', 'Счёт', 'Годы', 'Проверка'];
  var BANKS = ['기업은행 · Айбикей', '국민은행 · Кукмин', '우리은행 · Урибанк', '신한은행 · Шинхан', '하나은행 · Хана', '농협은행 · Нонхёп', 'Другой банк'];
  var card = document.getElementById('card');
  function $(id) { return document.getElementById(id); }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function rnd(n) { var a = new Uint8Array(n); crypto.getRandomValues(a); return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
  try { S.sid = sessionStorage.getItem('kq_sid'); } catch (e) {}
  if (!S.sid) { S.sid = rnd(16); try { sessionStorage.setItem('kq_sid', S.sid); } catch (e) {} }

  function api(op, body) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ op: op, office: S.office, k: S.k, sid: S.sid }, body || {})) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.error || 'Ошибка. Попробуйте ещё раз.'); e.field = j.field; e.status = r.status; throw e; } return j; }); });
  }
  function progress() {
    var p = $('prog'); p.hidden = S.step === 6;
    // порядок экранов: 7 — загрузка ID иждивенцев, вставляется перед проверкой
    var order = S.dependents === 'yes' && S.depSet ? [0, 1, 2, 3, 4, 7, 5] : [0, 1, 2, 3, 4, 5];
    var pos = Math.max(0, order.indexOf(S.step)), names = order.map(function (i) { return i === 7 ? 'Иждивенцы' : STEPS[i]; });
    $('plbl').textContent = 'Шаг ' + (pos + 1) + ' из ' + order.length;
    $('pname').textContent = names[pos] || '';
    $('pbar').style.width = Math.round(((pos + 1) / order.length) * 100) + '%';
    $('dots').innerHTML = order.map(function (n, i) { return '<s class="' + (i === pos ? 'on' : i < pos ? 'ok' : '') + '">' + (i < pos ? '✓' : i + 1) + '</s>'; }).join('');
    window.scrollTo(0, 0);
  }
  function err(m) { var e = $('err'); if (e) e.textContent = m || ''; }
  function go(n) { S.step = n; render(); }
  function digits(v) { return String(v || '').replace(/\D/g, ''); }

  // ── шаги ──
  var VIEW = [
    function consent() {
      card.innerHTML = '<h1>Здравствуйте!</h1><div class="sub">Встаньте в очередь с телефона — это 2–3 минуты. Приготовьте <b>ID-карту</b> и <b>банковскую книжку</b> (или приложение банка).</div>' +
        '<label class="chk"><input type="checkbox" id="c1"><span>Согласен(на) на обработку моих данных (телефон, ФИО, банковский счёт, фото документов) компанией KOMPASS для записи в очередь и оказания услуги перерасчёта налога. Фото документов распознаются автоматически сервисом Anthropic (серверы в США). <a href="/privacy.html" data-doc="/privacy.html">Политика конфиденциальности</a><span class="cn">Храним, пока вы пользуетесь услугой, и 1 год после последнего обращения. Вы вправе отказаться — тогда оформить заявку через эту форму не получится, подойдите к менеджеру.</span></span></label>' +
        '<label class="chk"><input type="checkbox" id="c2"><span>Отдельно согласен(на) на обработку <b>номера ID-карты</b> (외국인등록번호) для подачи документов в налоговую.<span class="cn">Храним, пока вы пользуетесь услугой, и 1 год после последнего обращения. Вы вправе отказаться — тогда оформить заявку через эту форму не получится, подойдите к менеджеру.</span></span></label>' +
        '<button class="btn" id="n" disabled>Начать</button><div class="err" id="err"></div>';
      var f = function () { $('n').disabled = !($('c1').checked && $('c2').checked); };
      $('c1').checked = !!S.consent; $('c2').checked = !!S.consent; f();
      $('c1').onchange = f; $('c2').onchange = f;
      $('n').onclick = function () { S.consent = true; go(1); };
    },
    function phone() {
      card.innerHTML = '<h1>Ваш телефон</h1><div class="sub">Корейский номер. На него придёт СМС, когда подойдёт ваша очередь.</div>' +
        '<label class="f">Номер телефона</label><input type="tel" id="ph" inputmode="numeric" placeholder="010-1234-5678" autocomplete="tel" value="' + esc(S.phone || '') + '">' +
        '<label class="f">Оператор связи</label><div class="chips" id="ops"></div>' +
        '<button class="btn" id="n">Дальше</button><button class="back" id="b">← Назад</button><div class="err" id="err"></div>';
      var ops = S.operators || ['SKT', 'KT', 'LG U+'];
      var draw = function () { $('ops').innerHTML = ops.map(function (o) { return '<div class="chip' + (S.operator === o ? ' on' : '') + '" data-o="' + esc(o) + '">' + esc(o) + '</div>'; }).join(''); };
      draw();
      $('ops').onclick = function (e) { var o = e.target.getAttribute('data-o'); if (o) { S.operator = o; draw(); } };
      $('ph').oninput = function () { var d = digits(this.value).slice(0, 11); this.value = d.length > 7 ? d.slice(0, 3) + '-' + d.slice(3, d.length - 4) + '-' + d.slice(-4) : d.length > 3 ? d.slice(0, 3) + '-' + d.slice(3) : d; };
      $('n').onclick = function () {
        var d = digits($('ph').value);
        if (!/^01\d{8,9}$/.test(d)) { $('ph').className = 'bad'; return err('Проверьте номер: он начинается с 010 и содержит 10–11 цифр'); }
        if (!S.operator) return err('Выберите оператора связи');
        S.phone = $('ph').value; go(2);
      };
      $('b').onclick = function () { go(0); };
    },
    function arc() { photoStep('arc', 'Фото ID-карты', 'Нужно фото <b>лицевой стороны</b> ID-карты (외국인등록증): сделайте снимок или выберите готовое фото. Вся карта в кадре, без бликов.', 3, 1); },
    function bank() { photoStep('bank', 'Банковский счёт', 'Нужно фото <b>первой страницы книжки</b> (통장) или скриншот приложения банка, где виден номер счёта. На этот счёт придёт возврат налога.', 4, 2); },
    function years() {
      var ys = S.yearsList || [];
      card.innerHTML = '<h1>За какие годы?</h1><div class="sub">Отметьте годы, когда вы работали в Корее. Не уверены — оставьте пустым, менеджер проверит все.</div>' +
        '<div class="chips" id="ys"></div>' +
        '<label class="f" style="margin-top:18px">Есть ли иждивенцы в Корее? (супруг(а), дети, родители, которые живут с вами)</label><div class="chips" id="dp"></div>' +
        '<button class="btn" id="n">Дальше</button><button class="back" id="b">← Назад</button><div class="err" id="err"></div>';
      var draw = function () {
        $('ys').innerHTML = ys.map(function (y) { return '<div class="chip' + (S.years.indexOf(y) >= 0 ? ' on' : '') + '" data-y="' + y + '">' + y + '</div>'; }).join('');
        $('dp').innerHTML = [['no', 'Нет'], ['yes', 'Да'], ['', 'Не знаю']].map(function (x) { return '<div class="chip' + (S.dependents === x[0] && S.depSet ? ' on' : '') + '" data-d="' + x[0] + '">' + x[1] + '</div>'; }).join('');
      };
      draw();
      $('ys').onclick = function (e) { var y = e.target.getAttribute('data-y'); if (!y) return; var i = S.years.indexOf(y); if (i >= 0) S.years.splice(i, 1); else S.years.push(y); draw(); };
      $('dp').onclick = function (e) { if (!e.target.hasAttribute('data-d')) return; S.dependents = e.target.getAttribute('data-d'); S.depSet = true; draw(); };
      $('n').onclick = function () { go(S.dependents === 'yes' && S.depSet ? 7 : 5); };
      $('b').onclick = function () { go(3); };
    },
    function review() {
      var acc = S.bankSkip ? 'покажу менеджеру' : (S.bank || '') + ' ' + (S.account || '') + (S.holderBad ? ' ⚠️ владелец: ' + (S.bankHolder || '') : '');
      card.innerHTML = '<h1>Проверьте данные</h1><div class="sub">Если всё верно — нажмите зелёную кнопку.</div><div class="rev">' +
        '<div><span>ФИО</span><b>' + esc(S.fio) + '</b></div>' +
        '<div><span>ID-карта</span><b>' + esc(digits(S.id).replace(/^(\d{6})(\d{7})$/, '$1-$2')) + '</b></div>' +
        '<div><span>Телефон</span><b>' + esc(S.phone) + ' · ' + esc(S.operator) + '</b></div>' +
        '<div><span>Счёт</span><b>' + esc(acc) + '</b></div>' +
        '<div><span>Годы</span><b>' + esc(S.years.length ? S.years.slice().sort().join(', ') : 'проверит менеджер') + '</b></div>' +
        '<div><span>Иждивенцы</span><b>' + (S.dependents === 'yes' ? (S.deps.length && !S.depLater ? 'да · ID-карт: ' + S.deps.length : 'да · ID покажу менеджеру') : S.dependents === 'no' ? 'нет' : 'не знаю') + '</b></div></div>' +
        '<button class="btn g" id="n">Встать в очередь</button><button class="back" id="b">← Исправить</button><div class="err" id="err"></div>';
      $('b').onclick = function () { go(1); };
      $('n').onclick = function () {
        var btn = this; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Записываем…'; err('');
        api('submit', { consent: true, consentId: true, phone: S.phone, operator: S.operator, fio: S.fio, id: S.id, visa: S.visa || '', bank: S.bankSkip ? '' : (S.bank === 'Другой банк' ? (S.bankRaw || 'другой') : S.bank.split(' · ')[0]), account: S.bankSkip ? '' : S.account, years: S.years, dependents: S.dependents, deps: S.depLater ? [] : S.deps, group: S.group })
          .then(function (j) {
            S.ticket = { id: j.id, token: j.token, group: j.group, office: S.office, k: S.k };
            try { localStorage.setItem('kq_ticket', JSON.stringify(S.ticket)); sessionStorage.removeItem('kq_sid'); } catch (e) {}
            S.state = j; go(6);
          })
          .catch(function (e) { btn.disabled = false; btn.textContent = 'Встать в очередь'; err(e.message); if (e.field === 'phone' || e.field === 'operator') setTimeout(function () { go(1); }, 1500); if (e.field === 'fio' || e.field === 'id') setTimeout(function () { go(2); }, 1500); if (e.field === 'account') setTimeout(function () { go(3); }, 1500); });
      };
    },
    function ticket() {
      var j = S.state || {};
      var body = j.state === 'called'
        ? '<div class="call">🔔 ВАС ВЫЗЫВАЮТ!<br><span style="font-size:16px;font-weight:600">Подойдите к ' + (j.desk ? 'столу ' + esc(j.desk) : 'менеджеру') + (j.manager ? ' (' + esc(j.manager) + ')' : '') + '</span></div>'
        : j.state === 'done' ? '<div class="st">Ваша заявка в работе у менеджера.</div>'
        : '<div class="st">' + (j.ahead > 0 ? 'Перед вами: <b>' + j.ahead + '</b> чел.' : '<b>Вы следующий!</b>') + '</div><div class="note" style="text-align:center">Не закрывайте страницу. Когда подойдёт очередь, здесь появится вызов' + (j.test ? '. <b>Тестовый режим: СМС не отправляется.</b>' : ' и придёт СМС.') + '</div>';
      card.innerHTML = '<div class="sub" style="text-align:center;margin-bottom:0">' + (j.again ? 'Вы уже в очереди · ' : '') + esc(j.officeName || '') + ' · ваш номер</div><div class="num">' + esc(j.no || '') + '</div>' + body +
        '<div class="promo"><b>Не хотите ждать в неведении?</b><br>В приложении Kompass — статус вашего перерасчёта, сроки визы, штрафы и напоминания. Бесплатно.<a href="/app">Установить приложение</a></div>' +
        '<div class="note" style="text-align:center;margin-top:18px">Пришли вдвоём и второй человек тоже работает?<br>Ему нужна своя заявка и свой номер.</div>' +
        '<button class="back" id="more" style="margin-top:6px">Оформить заявку второму работающему →</button>' +
        '<div class="note" style="text-align:center;margin-top:4px">Иждивенцев (детей, родителей) добавлять не нужно — они уже в вашей заявке.</div>' +
        (j.test && j.state !== 'done' ? '<button class="back" id="tcall" style="margin-top:18px">' + (j.state === 'called' ? '🧪 Тест: вернуть в очередь' : '🧪 Тест: вызвать меня к столу') + '</button>' : '') +
        (j.test ? '<button class="back" id="again" style="margin-top:' + (j.state !== 'done' ? '0' : '18px') + '">🧪 Тест: сбросить номер и начать заново</button>' : '');
      // проверка экрана вызова без менеджера — служба выполняет это только для тестовых заявок (номер T…)
      if ($('tcall')) $('tcall').onclick = function () {
        if (!S.ticket) return; this.disabled = true;
        api('status', { id: S.ticket.id, token: S.ticket.token, testCall: j.state === 'called' ? 'off' : 'on' }).then(function (r) { r.again = S.state && S.state.again; S.state = r; if (S.step === 6) VIEW[6](); }).catch(function () { if ($('tcall')) $('tcall').disabled = false; });
      };
      $('more').onclick = function () {
        if (!S.ticket || !S.ticket.k) return;
        location.href = '/queue?o=' + encodeURIComponent(S.ticket.office) + '&k=' + encodeURIComponent(S.ticket.k) + '&g=' + encodeURIComponent(S.ticket.group || '') + '&new=1';
      };
      // сброс сохранённого номера на этом телефоне (чужой телефон, проверка формы). Заявка в очереди остаётся:
      // если тот же человек зарегистрируется снова с той же ID-картой, он получит свой прежний номер.
      if ($('again')) $('again').onclick = function () {
        if (!confirm('Убрать этот номер с экрана и начать регистрацию заново? Заявка ' + (j.no || '') + ' останется в очереди.')) return;
        var t = S.ticket || {}; try { localStorage.removeItem('kq_ticket'); } catch (e) {}
        location.href = '/queue' + (t.office && t.k ? '?o=' + encodeURIComponent(t.office) + '&k=' + encodeURIComponent(t.k) : '');
      };
      if (j.state === 'called' && !S.buzzed) { S.buzzed = true; try { navigator.vibrate && navigator.vibrate([400, 200, 400, 200, 600]); } catch (e) {} }
      clearTimeout(S.tm);
      if (j.state !== 'done') S.tm = setTimeout(poll, j.state === 'called' ? 30000 : 10000);
    }
    ,
    function deps() {
      var REL = [['spouse', 'Супруг(а)'], ['child', 'Ребёнок'], ['parent', 'Родитель'], ['other', 'Другое']];
      var relName = function (k) { for (var i = 0; i < REL.length; i++) if (REL[i][0] === k) return REL[i][1]; return ''; };
      var list = S.deps.map(function (d, i) { return '<div><span>' + esc(relName(d.rel) || 'Иждивенец ' + (i + 1)) + '</span><b>' + esc(d.name || '') + '<br><small>' + esc(digits(d.id).replace(/^(\d{6})(\d{7})$/, '$1-$2')) + ' · <a href="#" data-rm="' + i + '">убрать</a></small></b></div>'; }).join('');
      card.innerHTML = '<h1>ID-карты иждивенцев</h1><div class="sub">Загрузите фото ID-карты <b>каждого</b> иждивенца (супруг(а), дети, родители). По одному фото на человека.</div>' +
        (list ? '<div class="rev" id="dl">' + list + '</div>' : '') +
        '<input type="file" id="file" accept="image/*" hidden>' +
        '<div id="pv"></div>' +
        '<div id="flds" hidden><div class="ex" id="msg"></div>' +
          '<label class="f">Кто это?</label><div class="chips" id="rl"></div>' +
          '<label class="f">ФИО латиницей, как в карте</label><input type="text" id="fio" autocapitalize="characters">' +
          '<label class="f">Номер ID-карты (13 цифр)</label><input type="tel" id="idn" inputmode="numeric" placeholder="000000-0000000">' +
          '<button class="btn" id="add">Добавить иждивенца</button></div>' +
        '<div id="acts">' +
          '<button class="btn" id="shot">📷 ' + (S.deps.length ? 'Загрузить ID-карту ещё одного иждивенца' : 'Загрузить ID-карту иждивенца') + '</button>' +
          '<button class="btn o" id="man">Ввести вручную</button>' +
          (S.deps.length ? '<button class="btn g" id="n">Все добавлены, дальше</button>' : '') +
          '<button class="btn o" id="skip">Нет с собой — покажу менеджеру</button>' +
        '</div><button class="back" id="b">← Назад</button><div class="err" id="err"></div>';
      var cur = { rel: '' };
      var drawRel = function () { $('rl').innerHTML = REL.map(function (r) { return '<div class="chip' + (cur.rel === r[0] ? ' on' : '') + '" data-r="' + r[0] + '">' + r[1] + '</div>'; }).join(''); };
      var openFields = function (m) { $('flds').hidden = false; $('acts').hidden = true; $('msg').innerHTML = m; drawRel(); };
      if ($('dl')) $('dl').onclick = function (e) { var i = e.target.getAttribute('data-rm'); if (i == null) return; e.preventDefault(); S.deps.splice(+i, 1); VIEW[7](); };
      $('shot').onclick = function () { $('file').click(); };
      $('man').onclick = function () { openFields('Введите данные с ID-карты иждивенца.'); };
      $('skip').onclick = function () { S.depLater = true; go(5); };
      if ($('n')) $('n').onclick = function () { S.depLater = false; go(5); };
      $('b').onclick = function () { go(4); };
      $('flds').onclick = function (e) { var r = e.target.getAttribute('data-r'); if (r) { cur.rel = r; drawRel(); } };
      $('idn').oninput = function () { var d = digits(this.value).slice(0, 13); this.value = d.length > 6 ? d.slice(0, 6) + '-' + d.slice(6) : d; };
      $('add').onclick = function () {
        var fio = $('fio').value.toUpperCase().trim(), idn = digits($('idn').value);
        if (!cur.rel) return err('Отметьте, кто это: супруг(а), ребёнок или родитель');
        if (!/^[A-Z][A-Z \-']{2,}$/.test(fio)) { $('fio').className = 'bad'; return err('Введите ФИО латинскими буквами, как в ID-карте'); }
        if (idn.length !== 13) { $('idn').className = 'bad'; return err('В номере ID-карты 13 цифр'); }
        if (idn === digits(S.id) || S.deps.some(function (d) { return digits(d.id) === idn; })) return err('Эта ID-карта уже добавлена');
        if (S.deps.length >= 6) return err('Больше 6 иждивенцев — остальных покажите менеджеру');
        S.deps.push({ name: fio, id: idn, rel: cur.rel }); S.depLater = false; VIEW[7]();
      };
      $('file').onchange = function () {
        var f = this.files && this.files[0]; this.value = ''; if (!f) return;
        err(''); var btn = $('shot'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Читаем документ…';
        shrink(f).then(function (d) { $('pv').innerHTML = pvHtml(d); return api('photo', { kind: 'dep', b64: d.split(',')[1] }); })
          .then(function (j) {
            var x = j.fields || {};
            openFields(j.recognized ? '✅ Документ распознан. <b>Проверьте каждую цифру</b> и отметьте, кто это.' : '⚠️ Не удалось прочитать фото. Введите данные вручную или вернитесь и переснимите.');
            $('fio').value = x.name ? String(x.name).toUpperCase() : ''; $('idn').value = x.id || '';
          }).catch(function (e) { btn.disabled = false; btn.textContent = '📷 Загрузить ID-карту иждивенца'; err(e.message); if (e.status !== 403) openFields('Введите данные вручную.'); });
      };
    }
  ];

  function poll() {
    if (!S.ticket) return;
    api('status', { id: S.ticket.id, token: S.ticket.token }).then(function (j) { j.again = S.state && S.state.again; S.state = j; if (S.step === 6) VIEW[6](); })
      .catch(function () { clearTimeout(S.tm); S.tm = setTimeout(poll, 20000); });
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && S.step === 6) poll(); });

  // шаг с фото: снять → распознать → проверить поля (или ввести вручную)
  function photoStep(kind, title, hint, next, prev) {
    var isArc = kind === 'arc', has = isArc ? S.arcShown : S.bankShown;
    var fields = isArc
      ? '<label class="f">ФИО латиницей, как в карте</label><input type="text" id="fio" autocapitalize="characters" value="' + esc(S.fio || '') + '">' +
        '<label class="f">Номер ID-карты (13 цифр)</label><input type="tel" id="idn" inputmode="numeric" placeholder="000000-0000000" value="' + esc(S.id || '') + '">'
      : '<label class="f">Банк</label><select id="bk"><option value="">— выберите —</option>' + BANKS.map(function (b) { return '<option' + (S.bank === b ? ' selected' : '') + '>' + esc(b) + '</option>'; }).join('') + '</select>' +
        '<label class="f">Номер счёта (только цифры)</label><input type="tel" id="acc" inputmode="numeric" value="' + esc(S.account || '') + '">';
    card.innerHTML = '<h1>' + title + '</h1><div class="sub">' + hint + '</div>' +
      '<input type="file" id="file" accept="image/*" hidden>' +
      '<div id="pv"></div>' +
      '<div id="flds"' + (has ? '' : ' hidden') + '><div class="ex" id="msg"></div>' + fields + '</div>' +
      '<button class="btn" id="shot">' + (has ? '📷 Загрузить другое фото' : (isArc ? '📷 Загрузить фото ID-карты' : '📷 Загрузить фото книжки')) + '</button>' +
      '<button class="btn g" id="n"' + (has ? '' : ' hidden') + '>Всё верно, дальше</button>' +
      '<button class="btn o" id="man"' + (has ? ' hidden' : '') + '>Ввести вручную</button>' +
      (isArc ? '' : '<button class="btn o" id="skip">Нет с собой — покажу менеджеру</button>') +
      '<button class="back" id="b">← Назад</button><div class="err" id="err"></div>';
    if (has) { $('msg').innerHTML = (isArc ? S.arcMsg : S.bankMsg) || 'Проверьте данные и исправьте, если нужно.'; if (!isArc && S.holderBad) { $('msg').className = 'ex warn'; $('n').textContent = 'Это мой счёт — дальше'; } }
    var pvKey = isArc ? 'arcPv' : 'bankPv';
    if (S[pvKey]) $('pv').innerHTML = pvHtml(S[pvKey]);
    var showFields = function (m) { $('flds').hidden = false; $('n').hidden = false; $('man').hidden = true; $('msg').innerHTML = m; if (isArc) { S.arcShown = true; S.arcMsg = m; } else { S.bankShown = true; S.bankMsg = m; } };
    $('shot').onclick = function () { $('file').click(); };
    $('man').onclick = function () { showFields('Введите данные с ' + (isArc ? 'ID-карты' : 'книжки') + ' вручную.'); };
    if (!isArc) $('skip').onclick = function () { S.bankSkip = true; go(next); };
    $('b').onclick = function () { save(); go(prev); };
    if (isArc) $('idn').oninput = function () { var d = digits(this.value).slice(0, 13); this.value = d.length > 6 ? d.slice(0, 6) + '-' + d.slice(6) : d; };
    function save() { if (isArc) { if ($('fio')) { S.fio = $('fio').value.toUpperCase().trim(); S.id = $('idn').value; } } else if ($('bk')) { S.bank = $('bk').value; S.account = digits($('acc').value); } }
    $('n').onclick = function () {
      save();
      if (isArc) {
        if (!/^[A-Z][A-Z \-']{2,}$/.test(S.fio)) { $('fio').className = 'bad'; return err('Введите ФИО латинскими буквами, как в ID-карте'); }
        if (digits(S.id).length !== 13) { $('idn').className = 'bad'; return err('В номере ID-карты 13 цифр'); }
      } else {
        if (!S.bank) return err('Выберите банк');
        if (S.account.length < 8) { $('acc').className = 'bad'; return err('Проверьте номер счёта'); }
        S.bankSkip = false;
      }
      go(next);
    };
    $('file').onchange = function () {
      var f = this.files && this.files[0]; this.value = ''; if (!f) return;
      err(''); var btn = $('shot'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Читаем документ…';
      shrink(f).then(function (d) {
        S[pvKey] = d; $('pv').innerHTML = pvHtml(d);
        return api('photo', { kind: kind, b64: d.split(',')[1], fio: S.fio || '' });
      }).then(function (j) {
        var x = j.fields || {};
        if (isArc) { if (x.name) S.fio = String(x.name).toUpperCase(); if (x.id) S.id = x.id; if (x.visa) S.visa = x.visa; $('fio').value = S.fio || ''; $('idn').value = S.id || ''; }
        else { if (x.bank) { S.bankRaw = String(x.bank); var hit = BANKS.filter(function (b) { return S.bankRaw.indexOf(b.slice(0, 2)) >= 0; })[0]; S.bank = hit || 'Другой банк'; $('bk').value = S.bank; } if (x.account) { S.account = x.account; $('acc').value = x.account; } }
        if (!isArc) { S.bankHolder = x.holder || ''; S.holderBad = x.holderCheck === 'mismatch'; }
        var bad = !isArc && S.holderBad;
        $('msg').className = 'ex' + (bad ? ' warn' : '');
        $('n').textContent = bad ? 'Это мой счёт — дальше' : 'Всё верно, дальше';
        showFields(bad ? '⚠️ Счёт на фото оформлен на <b>' + esc(S.bankHolder) + '</b>, а ID-карта — на <b>' + esc(S.fio) + '</b>.<br>Возврат налога приходит только на счёт самого заявителя. Загрузите фото <b>своей</b> книжки. Если это ваш счёт — продолжайте, менеджер проверит.'
          : j.recognized ? '✅ Документ распознан. <b>Проверьте каждую цифру</b> и исправьте, если что-то не так.'
          : j.wrongDoc ? '⚠️ Похоже, это другой документ. Переснимите ' + (isArc ? 'ID-карту' : 'книжку') + ' или введите данные вручную.'
          : '⚠️ Не удалось прочитать фото. Переснимите при хорошем свете или введите данные вручную.');
        btn.disabled = false; btn.textContent = '📷 Загрузить другое фото';
      }).catch(function (e) {
        btn.disabled = false; btn.textContent = isArc ? '📷 Загрузить фото ID-карты' : '📷 Загрузить фото книжки'; err(e.message);
        if (e.status === 403) return; showFields('Введите данные вручную.');
      });
    };
  }
  // уменьшаем фото на телефоне: быстрее отправка, меньше трафик
  function shrink(file) {
    return new Promise(function (ok, bad) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var m = 1600, k = Math.min(1, m / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        ok(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = function () { URL.revokeObjectURL(url); bad(new Error('Не удалось открыть фото. Попробуйте ещё раз.')); };
      img.src = url;
    });
  }

  // 15.11 (Сергей): фото остаётся НАД полями — его можно увеличивать (＋ / −, двумя пальцами, двойным касанием) и двигать пальцем,
  // а цифры сверять и править тут же, не закрывая фото. Блок прилипает к верху экрана, пока человек листает поля.
  function pvHtml(src) {
    return '<div class="pzw"><div class="pz" id="pz"><img src="' + src + '" alt="" draggable="false"></div>' +
      '<div class="pzc"><button type="button" data-pz="-1" aria-label="Уменьшить">−</button><span>Увеличьте и двигайте фото пальцем — сверяйте цифры с полями ниже</span><button type="button" data-pz="1" aria-label="Увеличить">＋</button></div></div>';
  }
  function pzSet(box, z, cx, cy) {
    var img = box.querySelector('img'); if (!img) return;
    var old = Number(box.getAttribute('data-z') || 1); z = Math.max(1, Math.min(5, z));
    // точка, вокруг которой увеличиваем (по умолчанию центр окна), остаётся на месте
    if (cx == null) { cx = box.clientWidth / 2; cy = box.clientHeight / 2; }
    var fx = (box.scrollLeft + cx) / (box.clientWidth * old), fy = (box.scrollTop + cy) / Math.max(1, img.clientHeight);
    img.style.width = (z * 100) + '%'; box.setAttribute('data-z', z);
    box.scrollLeft = fx * box.clientWidth * z - cx; box.scrollTop = fy * img.clientHeight - cy;
  }
  document.addEventListener('click', function (e) {
    var d = e.target && e.target.getAttribute && e.target.getAttribute('data-pz'); if (!d) return;
    var box = $('pz'); if (!box) return;
    var z = Number(box.getAttribute('data-z') || 1); pzSet(box, d === '1' ? z * 1.6 : z / 1.6);
  });
  var PZ = null, lastTap = 0;
  document.addEventListener('touchstart', function (e) {
    var box = e.target && e.target.closest ? e.target.closest('.pz') : null; if (!box) return;
    if (e.touches.length === 2) {
      var a = e.touches[0], b = e.touches[1], r = box.getBoundingClientRect();
      PZ = { box: box, d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), z: Number(box.getAttribute('data-z') || 1), cx: (a.clientX + b.clientX) / 2 - r.left, cy: (a.clientY + b.clientY) / 2 - r.top };
    } else if (e.touches.length === 1) {
      var now = Date.now();
      if (now - lastTap < 320) { var r2 = box.getBoundingClientRect(), z2 = Number(box.getAttribute('data-z') || 1); pzSet(box, z2 > 1.2 ? 1 : 2.6, e.touches[0].clientX - r2.left, e.touches[0].clientY - r2.top); e.preventDefault(); lastTap = 0; }
      else lastTap = now;
    }
  }, { passive: false });
  document.addEventListener('touchmove', function (e) {
    if (!PZ || e.touches.length !== 2) return;
    var a = e.touches[0], b = e.touches[1];
    pzSet(PZ.box, PZ.z * Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) / Math.max(1, PZ.d), PZ.cx, PZ.cy);
    PZ.z = Number(PZ.box.getAttribute('data-z') || 1); PZ.d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchend', function (e) { if (e.touches.length < 2) PZ = null; });
  // 15.11 (Сергей): документы открываем окном поверх формы, а не переходом на сайт — пожилые клиенты не находили дорогу назад
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[data-doc]') : null;
    if (a) {
      e.preventDefault();
      var m = document.createElement('div'); m.className = 'docm'; m.id = 'docm';
      m.innerHTML = '<div class="dh"><span>' + esc(a.textContent) + '</span><button type="button" class="dx" data-docx="1" aria-label="Закрыть">✕</button></div><iframe src="' + a.getAttribute('data-doc') + '" title="Документ"></iframe><div class="df"><button type="button" class="btn" data-docx="1">Закрыть и вернуться к форме</button></div>';
      document.body.appendChild(m); return;
    }
    if (e.target && e.target.getAttribute && e.target.getAttribute('data-docx') && $('docm')) $('docm').remove();
  });
  function render() { progress(); VIEW[S.step](); }
  function fail(m) { $('prog').hidden = true; card.innerHTML = '<h1>Электронная очередь</h1><div class="sub">' + m + '</div>'; }

  // ── запуск ──
  var saved = null; try { saved = JSON.parse(localStorage.getItem('kq_ticket') || 'null'); } catch (e) {}
  if (saved && !qs.get('new')) {
    // человек уже в очереди — показываем его номер (и после повторного сканирования QR тоже)
    S.ticket = saved; S.step = 6; $('prog').hidden = true;
    api('status', { id: saved.id, token: saved.token }).then(function (j) {
      if (j.state === 'done' && S.office && S.k) { try { localStorage.removeItem('kq_ticket'); } catch (e) {} S.ticket = null; start(); return; }
      S.state = j; VIEW[6]();
    }).catch(function () { try { localStorage.removeItem('kq_ticket'); } catch (e) {} S.ticket = null; start(); });
  } else start();

  function start() {
    if (!S.office || !S.k) return fail('Чтобы встать в очередь, отсканируйте <b>QR-код в офисе</b> KOMPASS камерой телефона.');
    api('open').then(function (j) {
      $('ofc').textContent = 'Электронная очередь · ' + (j.officeName || '');
      $('test').hidden = !j.test; S.operators = j.operators; S.yearsList = j.years || [];
      S.step = 0; render();
    }).catch(function (e) { fail(esc(e.message)); });
  }
})();
</script>
