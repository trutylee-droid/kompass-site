<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Фото документа в заявку — KOMPASS</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;color:#111827;font-family:-apple-system,'Noto Sans KR','Inter',sans-serif;line-height:1.45;padding:16px 14px 40px;display:flex;justify-content:center}
.wrap{width:100%;max-width:440px}
h1{font-size:20px;font-weight:800}
.sub{color:#475569;font-size:14px;margin:4px 0 14px}
.btn{display:block;width:100%;min-height:56px;border-radius:14px;border:1px solid #cbd5e1;background:#fff;color:#111827;font:inherit;font-size:17px;font-weight:700;margin-top:10px;cursor:pointer}
.btn:disabled{opacity:.4}
.log{margin-top:16px;font-size:14px}
.log div{padding:8px 10px;border-radius:10px;margin-top:6px;background:#ecfdf5;color:#065f46}
.log div.bad{background:#fef2f2;color:#b91c1c}
.note{font-size:12.5px;color:#64748b;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="h">Фото документа в заявку</h1>
  <div class="sub" id="sub">Проверяю ссылку…</div>
  <div id="btns" hidden>
    <button class="btn" data-k="bank">📷 Банковская книжка / счёт</button>
    <button class="btn" data-k="dep">📷 ID-карта иждивенца</button>
    <button class="btn" data-k="arc">📷 ID-карта заявителя</button>
    <button class="btn" data-k="other">📷 Другой документ</button>
    <input type="file" id="file" accept="image/*" hidden>
  </div>
  <div class="log" id="log"></div>
  <div class="note">Страница для сотрудника KOMPASS. Фото уходит только в открытую заявку; после съёмки нажмите в панели «Готово — обновить заявку».</div>
</div>
<script>
(function () {
  var t = new URLSearchParams(location.search).get('t') || '', kind = 'other';
  var NM = { bank: 'Книжка / счёт', dep: 'ID иждивенца', arc: 'ID-карта', other: 'Документ' };
  function $(i) { return document.getElementById(i); }
  function api(body) {
    return fetch('/api/queue', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ op: 'mup', t: t }, body)) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || 'Ошибка. Попробуйте ещё раз.'); return j; }); });
  }
  function shrink(file) {
    return new Promise(function (ok, bad) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var m = 1600, k = Math.min(1, m / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        ok(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = function () { URL.revokeObjectURL(url); bad(new Error('Не удалось открыть фото')); };
      img.src = url;
    });
  }
  function line(txt, bad) { var d = document.createElement('div'); if (bad) d.className = 'bad'; d.textContent = txt; $('log').prepend(d); }
  function busy(b) { Array.prototype.forEach.call(document.querySelectorAll('.btn'), function (x) { x.disabled = b; }); }
  api({ check: true }).then(function (j) {
    $('h').textContent = 'Заявка №' + (j.no || '');
    $('sub').textContent = 'Выберите документ и сфотографируйте. Ссылка действует ещё ' + j.left + ' мин.';
    $('btns').hidden = false;
  }).catch(function (e) { $('sub').textContent = e.message; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-k]'), function (b) {
    b.onclick = function () { kind = b.getAttribute('data-k'); $('file').value = ''; $('file').click(); };
  });
  $('file').onchange = function () {
    var f = this.files && this.files[0]; if (!f) return;
    busy(true); var k = kind;
    shrink(f).then(function (d) { return api({ kind: k, b64: d.split(',')[1] }); })
      .then(function (r) { busy(false); line('✓ ' + NM[k] + (r.note ? ' — ' + r.note : ' — добавлено в заявку')); })
      .catch(function (e) { busy(false); line('✕ ' + NM[k] + ': ' + e.message, true); });
  };
})();
</script>
</body>
</html>
