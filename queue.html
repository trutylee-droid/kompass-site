<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Электронная очередь — KOMPASS</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<meta name="theme-color" content="#0d1829">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:#0d1829;color:#fff;font-family:-apple-system,'Noto Sans KR','Inter',sans-serif;line-height:1.45;padding:14px 14px 40px;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:440px}
.top{display:flex;align-items:center;gap:10px;margin:4px 2px 12px}
.top img{width:34px;height:34px;border-radius:8px}
.top b{font-size:17px}.top span{color:#8aaad0;font-size:13px;display:block;margin-top:-2px}
.prog{margin:0 2px 12px}
.prog .lbl{display:flex;justify-content:space-between;font-size:13px;color:#8aaad0;margin-bottom:6px}
.prog .lbl b{color:#fff}
.bar{height:8px;background:rgba(255,255,255,.10);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#3182f6;border-radius:6px;transition:width .3s}
.dots{display:flex;gap:6px;margin-top:8px}
.dots s{flex:1;height:26px;border-radius:8px;background:rgba(255,255,255,.07);color:#6f87ab;font-size:12.5px;font-weight:700;text-decoration:none;display:flex;align-items:center;justify-content:center}
.dots s.on{background:#3182f6;color:#fff}.dots s.ok{background:rgba(16,185,129,.25);color:#6ee7b7}
.card{background:#14223a;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:20px 18px}
h1{font-size:21px;font-weight:800;margin-bottom:6px}
.sub{color:#b7c7df;font-size:14.5px;margin-bottom:14px}
label.f{display:block;font-size:13px;color:#8aaad0;margin:12px 0 5px}
input[type=text],input[type=tel],select{width:100%;height:52px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:#0f1b30;color:#fff;font:inherit;font-size:18px;padding:0 14px;outline:none}
input:focus,select:focus{border-color:#3182f6}
input.bad{border-color:#f87171}
.btn{display:block;width:100%;min-height:54px;border:none;border-radius:14px;background:#3182f6;color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer;margin-top:16px;padding:10px}
.btn:disabled{opacity:.4}
.btn.g{background:#10b981}.btn.o{background:transparent;border:1px solid rgba(255,255,255,.22);color:#c9d6ea;font-weight:600;font-size:15px;min-height:48px;margin-top:10px}
.back{background:none;border:none;color:#8aaad0;font:inherit;font-size:14px;margin-top:14px;cursor:pointer;width:100%;padding:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.18);font-size:16px;font-weight:600;cursor:pointer;user-select:none;min-width:74px;text-align:center}
.chip.on{background:#3182f6;border-color:#3182f6}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:#dbe6f7;margin:12px 0;cursor:pointer}
.chk input{width:24px;height:24px;flex:none;margin-top:1px}
a{color:#9fc3ff}
.err{color:#fca5a5;font-size:14px;margin-top:12px;text-align:center;min-height:1px}
.note{font-size:12.5px;color:#8aaad0;margin-top:10px}
.ph{width:100%;border-radius:12px;margin:10px 0 2px;max-height:210px;object-fit:cover;border:1px solid rgba(255,255,255,.12)}
.ex{background:rgba(255,255,255,.05);border-radius:12px;padding:12px;font-size:13.5px;color:#c9d6ea;margin-bottom:6px}
.rev{background:rgba(255,255,255,.05);border-radius:12px;padding:4px 12px}
.rev div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:14.5px}
.rev div:last-child{border:none}.rev span{color:#8aaad0;flex:none}.rev b{text-align:right;word-break:break-word}
.num{font-size:74px;font-weight:900;text-align:center;letter-spacing:1px;margin:6px 0 0;line-height:1.05}
.st{text-align:center;font-size:17px;margin:8px 0 4px}
.call{background:#10b981;border-radius:16px;padding:16px;text-align:center;font-size:20px;font-weight:800;margin-top:12px;animation:p 1.1s infinite}
@keyframes p{50%{opacity:.6}}
.promo{margin-top:14px;background:rgba(49,130,246,.12);border:1px solid rgba(49,130,246,.35);border-radius:16px;padding:14px;font-size:14px;color:#dbe6f7}
.promo a{display:block;margin-top:10px;background:#fff;color:#0d1829;text-align:center;font-weight:800;padding:12px;border-radius:12px;text-decoration:none}
.spin{width:22px;height:22px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;display:inline-block;animation:r .8s linear infinite;vertical-align:-5px;margin-right:8px}
@keyframes r{to{transform:rotate(360deg)}}
.test{background:#7c3aed;color:#fff;font-size:12.5px;font-weight:700;border-radius:10px;padding:6px 10px;margin-bottom:10px;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="/android-chrome-192.png" alt=""><div><b>KOMPASS</b><span id="ofc">Электронная очередь</span></div></div>
  <div class="test" id="test" hidden>🧪 Тестовый режим — заявка получит номер T…</div>
  <div class="prog" id="prog" hidden>
    <div class="lbl"><span id="plbl">Шаг 1 из 6</span><b id="pname"></b></div>
    <div class="bar"><i id="pbar"></i></div>
    <div class="dots" id="dots"></div>
  </div>
  <div class="card" id="card"><div class="sub"><span class="spin"></span>Загрузка…</div></div>
</div>

<script>
(function () {
  'use strict';
  var API = '/api/queue';
  var qs = new URLSearchParams(location.search);
  var S = { office: qs.get('o') || '', k: qs.get('k') || '', group: qs.get('g') || '', step: 0, years: [], dependents: '', operator: '', bankSkip: false };
  var STEPS = ['Согласие', 'Телефон', 'ID-карта', 'Счёт', 'Годы', 'Проверка'];
  var BANKS = ['기업은행 · Айбикей', '국민은행 · Кукмин', '우리은행 · Урибанк', '신한은행 · Шинхан', '하나은행 · Хана', '농협은행 · Нонхёп', 'Другой банк'];
  var card = document.getElementById('card');
  function $(id) { return document.getElementById(id); }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function rnd(n) { var a = new Uint8Array(n); crypto.getRandomValues(a); return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
  try { S.sid = sessionStorage.getItem('kq_sid'); } catch (e) {}
  if (!S.sid) { S.sid = rnd(16); try { sessionStorage.setItem('kq_sid', S.sid); } catch (e) {} }

  function api(op, body) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ op: op, office: S.office, k: S.k, sid: S.sid }, body || {})) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.error || 'Ошибка. Попробуйте ещё раз.'); e.field = j.field; e.status = r.status; throw e; } return j; }); });
  }
  function progress() {
    var p = $('prog'); p.hidden = S.step > 5;
    $('plbl').textContent = 'Шаг ' + (S.step + 1) + ' из ' + STEPS.length;
    $('pname').textContent = STEPS[S.step] || '';
    $('pbar').style.width = Math.round(((S.step + 1) / STEPS.length) * 100) + '%';
    $('dots').innerHTML = STEPS.map(function (n, i) { return '<s class="' + (i === S.step ? 'on' : i < S.step ? 'ok' : '') + '">' + (i < S.step ? '✓' : i + 1) + '</s>'; }).join('');
    window.scrollTo(0, 0);
  }
  function err(m) { var e = $('err'); if (e) e.textContent = m || ''; }
  function go(n) { S.step = n; render(); }
  function digits(v) { return String(v || '').replace(/\D/g, ''); }

  // ── шаги ──
  var VIEW = [
    function consent() {
      card.innerHTML = '<h1>Здравствуйте!</h1><div class="sub">Встаньте в очередь с телефона — это 2–3 минуты. Приготовьте <b>ID-карту</b> и <b>банковскую книжку</b> (или приложение банка).</div>' +
        '<label class="chk"><input type="checkbox" id="c1"><span>Согласен(на) на обработку моих данных (телефон, ФИО, банковский счёт, фото документов) компанией KOMPASS для записи в очередь и оказания услуги перерасчёта налога. Фото документов распознаются автоматически. <a href="/privacy.html" target="_blank">Политика конфиденциальности</a></span></label>' +
        '<label class="chk"><input type="checkbox" id="c2"><span>Отдельно согласен(на) на обработку <b>номера ID-карты</b> (외국인등록번호) для подачи документов в налоговую.</span></label>' +
        '<button class="btn" id="n" disabled>Начать</button><div class="err" id="err"></div>';
      var f = function () { $('n').disabled = !($('c1').checked && $('c2').checked); };
      $('c1').checked = !!S.consent; $('c2').checked = !!S.consent; f();
      $('c1').onchange = f; $('c2').onchange = f;
      $('n').onclick = function () { S.consent = true; go(1); };
    },
    function phone() {
      card.innerHTML = '<h1>Ваш телефон</h1><div class="sub">Корейский номер. На него придёт СМС, когда подойдёт ваша очередь.</div>' +
        '<label class="f">Номер телефона</label><input type="tel" id="ph" inputmode="numeric" placeholder="010-1234-5678" autocomplete="tel" value="' + esc(S.phone || '') + '">' +
        '<label class="f">Оператор связи</label><div class="chips" id="ops"></div>' +
        '<button class="btn" id="n">Дальше</button><button class="back" id="b">← Назад</button><div class="err" id="err"></div>';
      var ops = S.operators || ['SKT', 'KT', 'LG U+'];
      var draw = function () { $('ops').innerHTML = ops.map(function (o) { return '<div class="chip' + (S.operator === o ? ' on' : '') + '" data-o="' + esc(o) + '">' + esc(o) + '</div>'; }).join(''); };
      draw();
      $('ops').onclick = function (e) { var o = e.target.getAttribute('data-o'); if (o) { S.operator = o; draw(); } };
      $('ph').oninput = function () { var d = digits(this.value).slice(0, 11); this.value = d.length > 7 ? d.slice(0, 3) + '-' + d.slice(3, d.length - 4) + '-' + d.slice(-4) : d.length > 3 ? d.slice(0, 3) + '-' + d.slice(3) : d; };
      $('n').onclick = function () {
        var d = digits($('ph').value);
        if (!/^01\d{8,9}$/.test(d)) { $('ph').className = 'bad'; return err('Проверьте номер: он начинается с 010 и содержит 10–11 цифр'); }
        if (!S.operator) return err('Выберите оператора связи');
        S.phone = $('ph').value; go(2);
      };
      $('b').onclick = function () { go(0); };
    },
    function arc() { photoStep('arc', 'Фото ID-карты', 'Сфотографируйте <b>лицевую сторону</b> ID-карты (외국인등록증). Вся карта в кадре, без бликов.', 3, 1); },
    function bank() { photoStep('bank', 'Банковский счёт', 'Сфотографируйте <b>первую страницу книжки</b> (통장) или экран приложения банка, где виден номер счёта. На этот счёт придёт возврат налога.', 4, 2); },
    function years() {
      var ys = S.yearsList || [];
      card.innerHTML = '<h1>За какие годы?</h1><div class="sub">Отметьте годы, когда вы работали в Корее. Не уверены — оставьте пустым, менеджер проверит все.</div>' +
        '<div class="chips" id="ys"></div>' +
        '<label class="f" style="margin-top:18px">Есть ли иждивенцы в Корее? (супруг(а), дети, родители, которые живут с вами)</label><div class="chips" id="dp"></div>' +
        '<button class="btn" id="n">Дальше</button><button class="back" id="b">← Назад</button><div class="err" id="err"></div>';
      var draw = function () {
        $('ys').innerHTML = ys.map(function (y) { return '<div class="chip' + (S.years.indexOf(y) >= 0 ? ' on' : '') + '" data-y="' + y + '">' + y + '</div>'; }).join('');
        $('dp').innerHTML = [['no', 'Нет'], ['yes', 'Да'], ['', 'Не знаю']].map(function (x) { return '<div class="chip' + (S.dependents === x[0] && S.depSet ? ' on' : '') + '" data-d="' + x[0] + '">' + x[1] + '</div>'; }).join('');
      };
      draw();
      $('ys').onclick = function (e) { var y = e.target.getAttribute('data-y'); if (!y) return; var i = S.years.indexOf(y); if (i >= 0) S.years.splice(i, 1); else S.years.push(y); draw(); };
      $('dp').onclick = function (e) { if (!e.target.hasAttribute('data-d')) return; S.dependents = e.target.getAttribute('data-d'); S.depSet = true; draw(); };
      $('n').onclick = function () { go(5); };
      $('b').onclick = function () { go(3); };
    },
    function review() {
      var acc = S.bankSkip ? 'покажу менеджеру' : (S.bank || '') + ' ' + (S.account || '');
      card.innerHTML = '<h1>Проверьте данные</h1><div class="sub">Если всё верно — нажмите зелёную кнопку.</div><div class="rev">' +
        '<div><span>ФИО</span><b>' + esc(S.fio) + '</b></div>' +
        '<div><span>ID-карта</span><b>' + esc(digits(S.id).replace(/^(\d{6})(\d{7})$/, '$1-$2')) + '</b></div>' +
        '<div><span>Телефон</span><b>' + esc(S.phone) + ' · ' + esc(S.operator) + '</b></div>' +
        '<div><span>Счёт</span><b>' + esc(acc) + '</b></div>' +
        '<div><span>Годы</span><b>' + esc(S.years.length ? S.years.slice().sort().join(', ') : 'проверит менеджер') + '</b></div>' +
        '<div><span>Иждивенцы</span><b>' + (S.dependents === 'yes' ? 'да' : S.dependents === 'no' ? 'нет' : 'не знаю') + '</b></div></div>' +
        '<button class="btn g" id="n">Встать в очередь</button><button class="back" id="b">← Исправить</button><div class="err" id="err"></div>';
      $('b').onclick = function () { go(1); };
      $('n').onclick = function () {
        var btn = this; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Записываем…'; err('');
        api('submit', { consent: true, consentId: true, phone: S.phone, operator: S.operator, fio: S.fio, id: S.id, visa: S.visa || '', bank: S.bankSkip ? '' : (S.bank === 'Другой банк' ? (S.bankRaw || 'другой') : S.bank.split(' · ')[0]), account: S.bankSkip ? '' : S.account, years: S.years, dependents: S.dependents, group: S.group })
          .then(function (j) {
            S.ticket = { id: j.id, token: j.token, group: j.group, office: S.office, k: S.k };
            try { localStorage.setItem('kq_ticket', JSON.stringify(S.ticket)); sessionStorage.removeItem('kq_sid'); } catch (e) {}
            S.state = j; go(6);
          })
          .catch(function (e) { btn.disabled = false; btn.textContent = 'Встать в очередь'; err(e.message); if (e.field === 'phone' || e.field === 'operator') setTimeout(function () { go(1); }, 1500); if (e.field === 'fio' || e.field === 'id') setTimeout(function () { go(2); }, 1500); if (e.field === 'account') setTimeout(function () { go(3); }, 1500); });
      };
    },
    function ticket() {
      var j = S.state || {};
      var body = j.state === 'called'
        ? '<div class="call">🔔 ВАС ВЫЗЫВАЮТ!<br><span style="font-size:16px;font-weight:600">Подойдите к ' + (j.desk ? 'столу ' + esc(j.desk) : 'менеджеру') + (j.manager ? ' (' + esc(j.manager) + ')' : '') + '</span></div>'
        : j.state === 'done' ? '<div class="st">Ваша заявка в работе у менеджера.</div>'
        : '<div class="st">' + (j.ahead > 0 ? 'Перед вами: <b>' + j.ahead + '</b> чел.' : '<b>Вы следующий!</b>') + '</div><div class="note" style="text-align:center">Не закрывайте страницу. Когда подойдёт очередь, здесь появится вызов и придёт СМС.</div>';
      card.innerHTML = '<div class="sub" style="text-align:center;margin-bottom:0">' + (j.again ? 'Вы уже в очереди · ' : '') + esc(j.officeName || '') + ' · ваш номер</div><div class="num">' + esc(j.no || '') + '</div>' + body +
        '<button class="btn o" id="more">+ Добавить ещё человека (супруг(а), родственник)</button>' +
        '<div class="promo"><b>Не хотите ждать в неведении?</b><br>В приложении Kompass — статус вашего перерасчёта, сроки визы, штрафы и напоминания. Бесплатно.<a href="/app">Установить приложение</a></div>';
      $('more').onclick = function () {
        if (!S.ticket || !S.ticket.k) return;
        location.href = '/queue?o=' + encodeURIComponent(S.ticket.office) + '&k=' + encodeURIComponent(S.ticket.k) + '&g=' + encodeURIComponent(S.ticket.group || '') + '&new=1';
      };
      if (j.state === 'called' && !S.buzzed) { S.buzzed = true; try { navigator.vibrate && navigator.vibrate([400, 200, 400, 200, 600]); } catch (e) {} }
      clearTimeout(S.tm);
      if (j.state !== 'done') S.tm = setTimeout(poll, j.state === 'called' ? 30000 : 10000);
    }
  ];

  function poll() {
    if (!S.ticket) return;
    api('status', { id: S.ticket.id, token: S.ticket.token }).then(function (j) { j.again = S.state && S.state.again; S.state = j; if (S.step === 6) VIEW[6](); })
      .catch(function () { clearTimeout(S.tm); S.tm = setTimeout(poll, 20000); });
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && S.step === 6) poll(); });

  // шаг с фото: снять → распознать → проверить поля (или ввести вручную)
  function photoStep(kind, title, hint, next, prev) {
    var isArc = kind === 'arc', has = isArc ? S.arcShown : S.bankShown;
    var fields = isArc
      ? '<label class="f">ФИО латиницей, как в карте</label><input type="text" id="fio" autocapitalize="characters" value="' + esc(S.fio || '') + '">' +
        '<label class="f">Номер ID-карты (13 цифр)</label><input type="tel" id="idn" inputmode="numeric" placeholder="000000-0000000" value="' + esc(S.id || '') + '">'
      : '<label class="f">Банк</label><select id="bk"><option value="">— выберите —</option>' + BANKS.map(function (b) { return '<option' + (S.bank === b ? ' selected' : '') + '>' + esc(b) + '</option>'; }).join('') + '</select>' +
        '<label class="f">Номер счёта (только цифры)</label><input type="tel" id="acc" inputmode="numeric" value="' + esc(S.account || '') + '">';
    card.innerHTML = '<h1>' + title + '</h1><div class="sub">' + hint + '</div>' +
      '<input type="file" id="file" accept="image/*" capture="environment" hidden>' +
      '<div id="pv"></div>' +
      '<div id="flds"' + (has ? '' : ' hidden') + '><div class="ex" id="msg"></div>' + fields + '</div>' +
      '<button class="btn" id="shot">' + (has ? '📷 Переснять' : '📷 Сфотографировать') + '</button>' +
      '<button class="btn g" id="n"' + (has ? '' : ' hidden') + '>Всё верно, дальше</button>' +
      '<button class="btn o" id="man"' + (has ? ' hidden' : '') + '>Ввести вручную</button>' +
      (isArc ? '' : '<button class="btn o" id="skip">Нет с собой — покажу менеджеру</button>') +
      '<button class="back" id="b">← Назад</button><div class="err" id="err"></div>';
    if (has) $('msg').innerHTML = (isArc ? S.arcMsg : S.bankMsg) || 'Проверьте данные и исправьте, если нужно.';
    var pvKey = isArc ? 'arcPv' : 'bankPv';
    if (S[pvKey]) $('pv').innerHTML = '<img class="ph" src="' + S[pvKey] + '" alt="">';
    var showFields = function (m) { $('flds').hidden = false; $('n').hidden = false; $('man').hidden = true; $('msg').innerHTML = m; if (isArc) { S.arcShown = true; S.arcMsg = m; } else { S.bankShown = true; S.bankMsg = m; } };
    $('shot').onclick = function () { $('file').click(); };
    $('man').onclick = function () { showFields('Введите данные с ' + (isArc ? 'ID-карты' : 'книжки') + ' вручную.'); };
    if (!isArc) $('skip').onclick = function () { S.bankSkip = true; go(next); };
    $('b').onclick = function () { save(); go(prev); };
    if (isArc) $('idn').oninput = function () { var d = digits(this.value).slice(0, 13); this.value = d.length > 6 ? d.slice(0, 6) + '-' + d.slice(6) : d; };
    function save() { if (isArc) { if ($('fio')) { S.fio = $('fio').value.toUpperCase().trim(); S.id = $('idn').value; } } else if ($('bk')) { S.bank = $('bk').value; S.account = digits($('acc').value); } }
    $('n').onclick = function () {
      save();
      if (isArc) {
        if (!/^[A-Z][A-Z \-']{2,}$/.test(S.fio)) { $('fio').className = 'bad'; return err('Введите ФИО латинскими буквами, как в ID-карте'); }
        if (digits(S.id).length !== 13) { $('idn').className = 'bad'; return err('В номере ID-карты 13 цифр'); }
      } else {
        if (!S.bank) return err('Выберите банк');
        if (S.account.length < 8) { $('acc').className = 'bad'; return err('Проверьте номер счёта'); }
        S.bankSkip = false;
      }
      go(next);
    };
    $('file').onchange = function () {
      var f = this.files && this.files[0]; this.value = ''; if (!f) return;
      err(''); var btn = $('shot'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Читаем документ…';
      shrink(f).then(function (d) {
        S[pvKey] = d; $('pv').innerHTML = '<img class="ph" src="' + d + '" alt="">';
        return api('photo', { kind: kind, b64: d.split(',')[1] });
      }).then(function (j) {
        var x = j.fields || {};
        if (isArc) { if (x.name) S.fio = String(x.name).toUpperCase(); if (x.id) S.id = x.id; if (x.visa) S.visa = x.visa; $('fio').value = S.fio || ''; $('idn').value = S.id || ''; }
        else { if (x.bank) { S.bankRaw = String(x.bank); var hit = BANKS.filter(function (b) { return S.bankRaw.indexOf(b.slice(0, 2)) >= 0; })[0]; S.bank = hit || 'Другой банк'; $('bk').value = S.bank; } if (x.account) { S.account = x.account; $('acc').value = x.account; } }
        showFields(j.recognized ? '✅ Документ распознан. <b>Проверьте каждую цифру</b> и исправьте, если что-то не так.'
          : j.wrongDoc ? '⚠️ Похоже, это другой документ. Переснимите ' + (isArc ? 'ID-карту' : 'книжку') + ' или введите данные вручную.'
          : '⚠️ Не удалось прочитать фото. Переснимите при хорошем свете или введите данные вручную.');
        btn.disabled = false; btn.textContent = '📷 Переснять';
      }).catch(function (e) {
        btn.disabled = false; btn.textContent = '📷 Сфотографировать'; err(e.message);
        if (e.status === 403) return; showFields('Введите данные вручную.');
      });
    };
  }
  // уменьшаем фото на телефоне: быстрее отправка, меньше трафик
  function shrink(file) {
    return new Promise(function (ok, bad) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var m = 1600, k = Math.min(1, m / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        ok(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = function () { URL.revokeObjectURL(url); bad(new Error('Не удалось открыть фото. Попробуйте ещё раз.')); };
      img.src = url;
    });
  }

  function render() { progress(); VIEW[S.step](); }
  function fail(m) { $('prog').hidden = true; card.innerHTML = '<h1>Электронная очередь</h1><div class="sub">' + m + '</div>'; }

  // ── запуск ──
  var saved = null; try { saved = JSON.parse(localStorage.getItem('kq_ticket') || 'null'); } catch (e) {}
  if (saved && !qs.get('new')) {
    // человек уже в очереди — показываем его номер (и после повторного сканирования QR тоже)
    S.ticket = saved; S.step = 6; $('prog').hidden = true;
    api('status', { id: saved.id, token: saved.token }).then(function (j) {
      if (j.state === 'done' && S.office && S.k) { try { localStorage.removeItem('kq_ticket'); } catch (e) {} S.ticket = null; start(); return; }
      S.state = j; VIEW[6]();
    }).catch(function () { try { localStorage.removeItem('kq_ticket'); } catch (e) {} S.ticket = null; start(); });
  } else start();

  function start() {
    if (!S.office || !S.k) return fail('Чтобы встать в очередь, отсканируйте <b>QR-код в офисе</b> KOMPASS камерой телефона.');
    api('open').then(function (j) {
      $('ofc').textContent = 'Электронная очередь · ' + (j.officeName || '');
      $('test').hidden = !j.test; S.operators = j.operators; S.yearsList = j.years || [];
      S.step = 0; render();
    }).catch(function (e) { fail(esc(e.message)); });
  }
})();
</script>
</body>
</html>
