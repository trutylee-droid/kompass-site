<!DOCTYPE html>
<html lang="ru">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0d1829;--navy2:#111f35;--blue:#2a4a7a;--silver:#b8c8e0;--gray:#8aaad0;--border:rgba(255,255,255,0.08);--green:#10b981}
body{background:var(--navy);color:#e8f0fc;font-family:'Inter',sans-serif;font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
body.lang-ko{font-family:'Noto Sans KR','Inter',sans-serif}
nav{position:sticky;top:0;z-index:100;padding:0 40px;height:60px;display:flex;align-items:center;justify-content:space-between;background:rgba(13,24,41,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-logo-icon{width:30px;height:30px;background:var(--blue);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff}
.nav-logo-text{font-weight:700;font-size:14px;letter-spacing:2px;color:#fff}
.nav-right{display:flex;align-items:center;gap:16px}
.nav-back{color:var(--gray);text-decoration:none;font-size:13px;transition:color 0.2s}
.nav-back:hover{color:#fff}
.lang-switcher{display:flex;gap:2px;background:rgba(255,255,255,0.06);border-radius:8px;padding:3px}
.lang-btn{padding:4px 10px;border-radius:6px;border:none;background:transparent;color:var(--gray);cursor:pointer;font-size:12px;font-weight:600;transition:all 0.15s;font-family:inherit}
.lang-btn.active{background:var(--blue);color:#fff}
.lang-btn:hover:not(.active){color:#fff}
.content{max-width:760px;margin:0 auto;padding:56px 40px 80px}
.doc-label{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--blue);margin-bottom:12px}
h1{font-size:32px;font-weight:700;color:#fff;margin-bottom:8px;line-height:1.2}
.doc-meta{font-size:13px;color:var(--gray);margin-bottom:48px;padding-bottom:24px;border-bottom:1px solid var(--border)}
h2{font-size:18px;font-weight:600;color:#fff;margin:36px 0 12px}
p{color:#8aaad0;margin-bottom:14px;font-size:15px}
ul{color:#8aaad0;margin:10px 0 14px 20px;font-size:15px}
ul li{margin-bottom:6px}
.highlight{background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.2);border-radius:10px;padding:16px 20px;margin:20px 0}
.highlight p{color:#6ee7b7;margin:0}
.warn{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-radius:10px;padding:16px 20px;margin:20px 0}
.warn p{color:#fca5a5;margin:0}
.info{background:rgba(42,74,122,0.2);border:1px solid rgba(42,74,122,0.3);border-radius:10px;padding:16px 20px;margin:20px 0}
.info p{color:var(--silver);margin:0}
.scenario-card{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:12px;padding:20px;margin:12px 0}
.scenario-card h3{font-size:15px;font-weight:600;color:#fff;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.scenario-card p{margin:0;font-size:14px}
.contact-block{margin-top:40px;padding:24px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:12px}
.contact-block p{margin-bottom:6px}
footer{text-align:center;padding:32px 40px;border-top:1px solid var(--border);font-size:13px;color:var(--gray)}
footer a{color:var(--gray);text-decoration:none;margin:0 12px}
footer a:hover{color:#fff}
@media(max-width:768px){nav,footer{padding-left:20px;padding-right:20px}.content{padding:40px 20px}}

<body>
<nav>

    body:`
<div class="highlight"><p>Приложение Kompass бесплатное. Платными являются только услуги, которые оказывают наши специалисты. Стоимость согласуется с вами до начала работы.</p></div>

<h2>1. Когда деньги возвращаются полностью</h2>
<ul>
<li>Вы отказались от услуги до того, как мы начали работу</li>
<li>Услуга не была оказана по вине Kompass</li>
<li>Произошло ошибочное или двойное списание</li>
</ul>

<h2>2. Частичный возврат</h2>
<p>Если вы отказались от услуги, когда работа уже начата, мы возвращаем оплату за вычетом стоимости фактически выполненной части работы. Объём выполненного мы покажем и объясним.</p>

<h2>3. Что не возвращается</h2>
<div class="warn"><p>Государственные пошлины и сборы, которые уже были оплачены за вас (в миграционную службу, посольство, налоговую и другие органы), не возвращаются — эти деньги получает государственный орган, а не Kompass.</p></div>
<ul>
<li>Работа, которая уже выполнена полностью</li>
<li>Выполненная работа, если государственный орган принял отрицательное решение — решение органа не зависит от нас</li>
<li>Услуги третьих лиц (переводчик, нотариус и т.п.), если они уже оплачены по вашему поручению</li>
</ul>

<h2>4. Как запросить возврат</h2>
<ul>
<li>Напишите на <a href="mailto:Kompass.kor@gmail.com" style="color:var(--silver)">Kompass.kor@gmail.com</a>, позвоните или обратитесь в офис</li>
<li>Укажите имя, номер телефона и услугу, за которую просите возврат</li>
</ul>
<p>Мы рассмотрим запрос в течение <strong>3 рабочих дней</strong> и сообщим решение.</p>

<h2>5. Как возвращаются деньги</h2>
<p>Возврат производится тем же способом, которым была произведена оплата. Срок зачисления на карту зависит от банка.</p>

<div class="contact-block">
<p><strong>Вопросы по возврату:</strong></p>
<p>Email: <a href="mailto:Kompass.kor@gmail.com" style="color:var(--silver)">Kompass.kor@gmail.com</a></p>
<p>Тел: 010-5183-5885</p>
<p style="color:var(--gray);font-size:13px;margin-top:8px">Время ответа: в течение 3 рабочих дней</p>
</div>`

    meta:'최종 업데이트: 2026년 9월 · Kompass 유료 서비스에 적용됩니다.',
    title:'환불정책',
    f_home:'홈', f_privacy:'개인정보처리방침', f_terms:'이용약관', f_refund:'환불정책',
    body:`
<div class="highlight"><p>Kompass 앱은 무료입니다. 유료는 전문 담당자가 제공하는 서비스뿐이며, 비용은 업무 시작 전에 고객과 협의합니다.</p></div>

<h2>1. 전액 환불</h2>
<ul>
<li>업무 시작 전에 서비스를 취소한 경우</li>
<li>Kompass의 귀책사유로 서비스가 제공되지 않은 경우</li>
<li>잘못된 결제 또는 중복 결제가 발생한 경우</li>
</ul>

<h2>2. 부분 환불</h2>
<p>업무가 이미 시작된 후 취소하는 경우, 실제로 수행된 업무 비용을 제외한 금액을 환불합니다. 수행된 업무 내용은 고객에게 설명해 드립니다.</p>

<h2>3. 환불되지 않는 항목</h2>
<div class="warn"><p>고객을 대신하여 이미 납부한 수수료 및 인지대(출입국관리사무소, 대사관, 세무서 등 기관 납부분)는 환불되지 않습니다. 해당 금액은 Kompass가 아닌 행정기관에 납부된 것입니다.</p></div>
<ul>
<li>이미 완료된 업무</li>
<li>행정기관이 불허·거부 결정을 한 경우의 수행 완료 업무 — 기관의 결정은 Kompass가 좌우할 수 없습니다</li>
<li>고객의 요청으로 이미 비용이 지급된 제3자 서비스(번역, 공증 등)</li>
</ul>

<h2>4. 환불 요청 방법</h2>
<ul>
<li><a href="mailto:Kompass.kor@gmail.com" style="color:var(--silver)">Kompass.kor@gmail.com</a>으로 이메일, 전화 또는 사무실 방문</li>
<li>성함, 전화번호, 환불을 요청하는 서비스를 알려 주세요</li>
</ul>
<p>요청은 <strong>영업일 기준 3일 이내</strong>에 검토 후 결과를 안내해 드립니다.</p>

<h2>5. 환불 방식</h2>
<p>환불은 결제한 수단과 동일한 방법으로 진행됩니다. 카드 환불 반영 기간은 카드사·은행에 따라 다릅니다.</p>

<div class="contact-block">
<p><strong>환불 문의:</strong></p>
<p>이메일: <a href="mailto:Kompass.kor@gmail.com" style="color:var(--silver)">Kompass.kor@gmail.com</a></p>
<p>전화: 010-5183-5885</p>
<p style="color:var(--gray);font-size:13px;margin-top:8px">답변 시간: 영업일 기준 3일 이내</p>
</div>`
  },
  en: {
    back:'← Back to home', label:'Legal document',
    meta:'Last updated: September 2026 · Applies to paid Kompass services.',
    title:'Refund Policy',
    f_home:'Home', f_privacy:'Privacy', f_terms:'Terms', f_refund:'Refunds',
    body:`
<div class="highlight"><p>The Kompass app is free. Only services provided by our specialists are paid, and the price is agreed with you before work begins.</p></div>

<h2>1. Full refund</h2>
<ul>
<li>You cancel the service before we start work</li>
<li>The service was not provided due to Kompass's fault</li>
<li>An erroneous or duplicate charge occurred</li>
</ul>

<h2>2. Partial refund</h2>
<p>If you cancel after work has started, we refund the payment minus the cost of the work actually completed. We will show and explain what has been done.</p>

<h2>3. Non-refundable</h2>
<div class="warn"><p>Government fees and duties already paid on your behalf (to immigration, embassies, the tax office and other authorities) are not refundable — this money goes to the government body, not to Kompass.</p></div>
<ul>
<li>Work that has already been fully completed</li>
<li>Completed work where a government authority issued a negative decision — the authority's decision is beyond our control</li>
<li>Third-party services (translator, notary, etc.) already paid at your request</li>
</ul>

<h2>4. How to request a refund</h2>
<ul>
<li>Email <a href="mailto:Kompass.kor@gmail.com" style="color:var(--silver)">Kompass.kor@gmail.com</a>, call us or visit an office</li>
<li>Provide your name, phone number and the service you want a refund for</li>
</ul>
<p>We review requests within <strong>3 business days</strong> and let you know the decision.</p>

<h2>5. How money is returned</h2>
<p>Refunds are made using the same method as the original payment. Card processing time depends on your bank.</p>

<div class="contact-block">
<p><strong>Refund enquiries:</strong></p>
<p>Email: <a href="mailto:Kompass.kor@gmail.com" style="color:var(--silver)">Kompass.kor@gmail.com</a></p>
<p>Phone: 010-5183-5885</p>
<p style="color:var(--gray);font-size:13px;margin-top:8px">Response time: within 3 business days</p>
</div>`
  }
};
let lang='ru';
function setLang(l){
  lang=l;document.documentElement.lang=l;document.body.className=l==='ko'?'lang-ko':'';
  document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(content[l][k]!==undefined)el.innerHTML=content[l][k];});
  document.getElementById('doc-body').innerHTML=content[l].body;
  document.querySelectorAll('.lang-btn').forEach(b=>{b.classList.toggle('active',b.textContent.trim()===(l==='ru'?'РУС':l==='ko'?'한국어':'ENG'));});
  const t={ru:'Политика возврата — Kompass',ko:'환불정책 — Kompass',en:'Refund Policy — Kompass'};document.title=t[l];
}
setLang('ru');
</script>
</body>
</html>
